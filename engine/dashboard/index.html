<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Visionary</title>
<style>
/* ============================================================================
   The Mac app's design language, ported.

   THEATRE stage: cool graphite up top, OLED near-black, warming toward the floor —
   the room is lit from BELOW. The warmth lives ONLY in the background; every
   foreground surface stays cool steel.

   STATE IS BRIGHTNESS, NEVER HUE. The steel ramp (dim -> steel -> bright) carries
   idle / armed / active. The single hue exception is --fault, for genuine faults.
   ========================================================================= */
:root{
  --bg-top:#1a1c1f; --bg-base:#0a0b0d; --bg-bottom:#0f0b08;
  --silver:#edeef0; --steel-bright:#e0e6ed; --steel:#9eb3cc; --steel-dim:#7a8799;
  --graphite:#1a1c1f; --fault:#eb4d45; --ember:#ff9e4d;
  --r-card:16px; --r-ctl:10px;
  --gap:14px;
}
/* Wide-gamut where it exists — these are the app's exact Display P3 values. */
@supports (color: color(display-p3 1 1 1)){
  :root{
    --bg-top:color(display-p3 .102 .110 .120);
    --bg-base:color(display-p3 .040 .044 .050);
    --bg-bottom:color(display-p3 .060 .045 .034);
    --silver:color(display-p3 .929 .933 .941);
    --steel-bright:color(display-p3 .880 .900 .930);
    --steel:color(display-p3 .620 .700 .800);
    --steel-dim:color(display-p3 .480 .530 .600);
    --graphite:color(display-p3 .10 .11 .12);
    --fault:color(display-p3 .92 .30 .27);
    --ember:color(display-p3 1 .62 .30);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg-base);
  background-image:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-base) 46%,var(--bg-bottom) 100%);
  background-attachment:fixed;
  color:var(--steel-bright);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:max(14px,env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
  max-width:960px;margin:0 auto;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ---- surfaces: liquid glass + silver bevel (bright top edge fading down) ---- */
.panel{position:relative;background:rgba(255,255,255,.045);border-radius:var(--r-card);
  box-shadow:0 8px 24px rgba(0,0,0,.35);padding:16px}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.045));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude;pointer-events:none}
/* recessed well: darker fill, hairline, no shadow (inputs, inner lists) */
.well{background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r-ctl);box-shadow:none}

.sec{margin-bottom:var(--gap)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  color:var(--steel-dim);margin:0 0 8px 2px}

/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:5px 11px;
  font-size:12px;font-weight:500;color:var(--steel);white-space:nowrap}
.pill.bright{color:var(--steel-bright)}
.pill.dim{color:var(--steel-dim)}
.pill.fault{color:var(--fault);border-color:rgba(235,77,69,.35)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55;flex:0 0 auto}
.dot.live{opacity:1;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---- buttons: capsule, lit = a cutout of the silver plate ---- */
.btn{appearance:none;border:1px solid rgba(255,255,255,.20);border-radius:999px;
  padding:8px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  color:var(--steel-bright);background:rgba(255,255,255,.07);
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:background .15s,opacity .15s}
.btn:hover{background:rgba(255,255,255,.11)}
.btn:active{opacity:.85}
.btn.lit{color:var(--graphite);border-color:rgba(255,255,255,.45);
  background:linear-gradient(180deg,var(--silver),var(--steel))}
.btn[disabled]{opacity:.45;cursor:default}

/* ---- header ---- */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px;
  background:linear-gradient(180deg,var(--silver),var(--steel));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand .sub{font-size:11.5px;color:var(--steel-dim)}

/* ---- the now-playing card ---- */
.now-top{display:flex;align-items:flex-start;gap:12px}
.now-ttl{font-size:15px;font-weight:600;color:var(--steel-bright);line-height:1.3;
  word-break:break-word}
.now-sub{font-size:12px;color:var(--steel-dim);margin-top:3px}
.pct{margin-left:auto;font-size:26px;font-weight:600;line-height:1;
  background:linear-gradient(180deg,var(--silver),var(--steel));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}

/* ---- steel progress: recessed capsule track + steel fill + scene-cut notches ---- */
/* Two-tone, as in the app: a SHADOW fill for live progress and a BRIGHT fill up to the
   last finished segment boundary — the gap between them is the segment being worked. Only
   the NEXT boundary is drawn; every notch at once reads as noise. */
.bar{position:relative;height:9px;border-radius:999px;background:rgba(255,255,255,.08);
  overflow:hidden;margin-top:12px}
.bar > i{position:absolute;top:0;bottom:0;left:0;border-radius:999px;width:0;
  transition:width .4s ease}
.bar > i.live{background:var(--steel);opacity:.28}
.bar > i.done{background:linear-gradient(180deg,var(--silver),var(--steel))}
.bar > u{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(0,0,0,.55);display:none}
/* peak repair: the segment being re-encoded is cut back out and refills with real frames */
.bar > b.cut{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.6);display:none}
.bar > b.refill{position:absolute;top:0;bottom:0;background:var(--steel);opacity:.55;display:none}

.readout{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.readout .big{font-size:17px;font-weight:600;color:var(--steel-bright)}
.readout .m{font-size:12px;font-weight:500;color:var(--steel-dim)}
.readout .seg{font-size:11px;color:var(--steel-dim);margin-left:auto}
.hold{display:flex;align-items:center;gap:9px;padding:11px 13px;margin-bottom:var(--gap);
  font-size:12.5px;color:var(--steel-bright)}
.hold b{font-weight:600}

.stages{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.stage{font-size:11px;padding:4px 9px;border-radius:999px;color:var(--steel-dim);
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.stage.on{color:var(--graphite);background:linear-gradient(180deg,var(--silver),var(--steel));
  border-color:rgba(255,255,255,.4);font-weight:600}
.stage.done{color:var(--steel)}

/* ---- rows (queue, lanes, health) ---- */
.rows{overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-top:1px solid rgba(255,255,255,.05);font-size:13px}
.row:first-child{border-top:0}
.row .k{color:var(--steel-dim);font-size:11px;min-width:26px;text-align:right}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .c{font-size:11px;color:var(--steel-dim);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:38%}
.row.head{color:var(--steel-bright)}
.ic{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;color:var(--steel-dim)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{padding:11px 13px}
.stat .n{font-size:17px;font-weight:600;color:var(--steel-bright);margin-top:3px}
.stat .n.warn{color:var(--fault)}
.stat .l{font-size:11px;color:var(--steel-dim)}

.issue{font-size:11.5px;color:var(--steel-dim);padding:8px 12px;
  border-top:1px solid rgba(255,255,255,.05);word-break:break-word}
.issue:first-child{border-top:0}
.issue b{color:var(--fault);font-weight:600}

.acts{display:flex;gap:2px;margin-left:auto;flex:0 0 auto}
.act{display:grid;place-items:center;width:32px;height:30px;border:0;border-radius:8px;
  background:transparent;color:var(--steel-dim);cursor:pointer;padding:0}
.act:hover{background:rgba(255,255,255,.08);color:var(--steel-bright)}
.act:disabled{opacity:.25;cursor:default;background:transparent}
.act svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.act.danger:hover{color:var(--fault)}
.row.grp{cursor:pointer}
.row.grp .chev{transition:transform .15s}
.row.grp.open .chev{transform:rotate(180deg)}
.row.kid{padding-left:34px;background:rgba(0,0,0,.14)}
.badge{font-size:10px;font-weight:600;color:var(--steel-bright);padding:3px 7px;
  border-radius:999px;background:rgba(255,255,255,.09);white-space:nowrap}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tab{flex:1;appearance:none;border:0;border-radius:8px;padding:8px 6px;font:inherit;
  font-size:12px;font-weight:600;cursor:pointer;color:var(--steel-dim);
  background:rgba(255,255,255,.05)}
.tab.on{color:var(--graphite);background:linear-gradient(180deg,var(--silver),var(--steel))}
.find{display:flex;align-items:center;gap:6px;padding:8px 10px;margin-bottom:8px}
.find input{flex:1;background:transparent;border:0;outline:0;color:var(--steel-bright);
  font:inherit;font-size:13px;min-width:0}
.hits{max-height:290px;overflow:auto;-webkit-overflow-scrolling:touch}
.hit{display:flex;align-items:center;gap:9px;padding:10px 12px;font-size:13px;
  border-top:1px solid rgba(255,255,255,.05);cursor:pointer}
.hit:first-child{border-top:0}
.hit:hover{background:rgba(255,255,255,.05)}
.hit .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit .tag{font-size:10px;color:var(--steel-dim);white-space:nowrap}
.hit.no{opacity:.45;cursor:default}
.hit.no:hover{background:transparent}
.notice{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;font-size:12.5px;
  color:var(--steel-bright);line-height:1.4}
.notice .ic{margin-top:1px}
.notice.warn{color:var(--fault)}
.notice .grow{flex:1;min-width:0}
.mini{appearance:none;border:1px solid rgba(255,255,255,.20);border-radius:999px;
  padding:5px 11px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;
  color:var(--steel-bright);background:rgba(255,255,255,.07);white-space:nowrap}
.mini:hover{background:rgba(255,255,255,.12)}
.mini[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
#shot{width:100%;border-radius:var(--r-ctl);display:block;background:rgba(0,0,0,.3)}
.shotwrap{padding:10px}
.muted{color:var(--steel-dim);font-size:12.5px;padding:14px;text-align:center}
.foot{margin-top:18px;text-align:center;font-size:11px;color:var(--steel-dim)}
.off{opacity:.5}
@media (max-width:520px){
  .pct{font-size:22px}
  .row .c{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<header>
  <div class="brand"><h1>Visionary</h1><span class="sub" id="mode"></span></div>
  <span class="pill" id="status"><span class="dot"></span><span>Connecting</span></span>
  <button class="act" id="histBtn" title="What Visionary has finished"
          style="width:34px;height:32px"><svg><use href="#i-hist"/></svg></button>
  <button class="btn" id="arm" disabled>&mdash;</button>
</header>

<section class="sec" id="histSec" style="display:none">
  <p class="lbl">Finished <span id="histN" style="color:var(--steel-dim)"></span>
     <button class="mini" id="histScan" style="float:right;margin-top:-4px">Find finished files</button></p>
  <div class="panel well rows" id="hist"><div class="muted">Loading&hellip;</div></div>
</section>

<section class="sec" id="holdSec" style="display:none">
  <div class="panel notice" id="hold"></div>
</section>

<section class="sec" id="stallSec" style="display:none">
  <div class="panel notice warn" id="stall"></div>
</section>

<section class="sec" id="nowSec">
  <div class="panel">
    <div class="now-top">
      <div style="min-width:0">
        <div class="now-ttl" id="nowTtl">Nothing processing</div>
        <div class="now-sub" id="nowSub">&mdash;</div>
      </div>
      <div class="pct" id="nowPct"></div>
    </div>
    <div class="bar" id="nowBar"><i class="live"></i><i class="done"></i><u></u><b class="cut"></b><b class="refill"></b></div>
    <div class="readout" id="readout"></div>
    <div class="stages" id="stages"></div>
  </div>
</section>

<section class="sec" id="laneSec" style="display:none">
  <p class="lbl">Also running</p>
  <div class="panel well rows" id="lanes"></div>
</section>

<section class="sec">
  <p class="lbl">Up next <span id="qCount" style="color:var(--steel-dim)"></span></p>
  <div class="panel well rows" id="queue"><div class="muted">Loading&hellip;</div></div>
</section>

<section class="sec">
  <p class="lbl">Machine</p>
  <div class="grid" id="health"></div>
</section>

<section class="sec">
  <p class="lbl">Add to the queue</p>
  <div class="tabs">
    <button class="tab on" data-tab="tv">TV Shows</button>
    <button class="tab" data-tab="movie">Movies</button>
    <button class="tab" data-tab="youtube">YouTube</button>
  </div>
  <div id="ytLink" style="display:none">
    <div class="panel well find">
      <svg class="ic"><use href="#i-link"/></svg>
      <input id="linkIn" type="text" placeholder="Paste a playlist, video or channel link&hellip;">
      <button class="mini" id="linkGo">Import</button>
    </div>
    <div class="panel notice" id="linkNote" style="display:none;margin-bottom:10px"></div>
  </div>
  <div class="panel well find">
    <svg class="ic"><use href="#i-find"/></svg>
    <input id="findIn" type="text" placeholder="Search&hellip;">
  </div>
  <div class="panel well hits" id="hits"></div>
  <p class="lbl" style="margin-top:12px">In the queue <span id="queuedN" style="color:var(--steel-dim)"></span></p>
  <div class="panel well rows" id="queued"></div>
</section>

<section class="sec">
  <p class="lbl">Screen control</p>
  <div class="panel">
    <div id="scState" style="font-size:12.5px;color:var(--steel-dim)"></div>
    <div class="btnrow" id="scBtns"></div>
  </div>
</section>

<section class="sec">
  <p class="lbl">The Mac's screen</p>
  <div class="panel shotwrap">
    <div class="btnrow" style="margin:0 0 9px">
      <button class="mini" id="shotBtn">Show the screen</button>
      <button class="mini" id="shotRef" style="display:none">Refresh</button>
      <button class="mini" id="shotHide" style="display:none">Hide</button>
    </div>
    <img id="shot" alt="" style="display:none">
    <div id="shotMsg" style="font-size:11.5px;color:var(--steel-dim)"></div>
  </div>
</section>

<section class="sec" id="issueSec" style="display:none">
  <p class="lbl">Recent issues</p>
  <div class="panel well" id="issues"></div>
</section>

<p class="foot" id="foot">&mdash;</p>

<script>
"use strict";
var RUN_STAGES = ["download","extend","topaz","resolve"];
var FIN_STAGES = ["remux","upload","cleanup"];
var ALL = RUN_STAGES.concat(FIN_STAGES);
var busy = false, timer = null;

function $(id){ return document.getElementById(id); }
function txt(el, s){ if (el.textContent !== s) el.textContent = s; }

/* An episode's display name: the app shows "Show — S04E12", never the raw filename. */
function itemName(o){
  if (!o) return "";
  if (o.kind === "youtube") return o.title || o.name || "video";
  if (o.kind === "movie")   return o.title || o.name || "movie";
  var ep = o.ep || "", se = o.series || "";
  return se && ep ? se + " — " + ep : (ep || se || o.title || o.name || "item");
}
/* Everything currently tracked, ranked by how far through the WHOLE pipeline it is —
   stage position first, then progress within that stage. An item in `upload` is closer to
   landing than one at 60% of `topaz`, so it is the one worth showing big (user-dictated). */
function pipelineItems(o){
  var out = [], p = o.progress || {};
  if (o.current){
    var same = (p.stage === o.stage);
    out.push({o: o.current, stage: o.stage || "",
              pct: (same && p.pct !== undefined) ? p.pct : null,
              notches: same ? (p.notches || []) : [], raw: same ? p : {}});
  }
  [o.finishing, o.finishing2].forEach(function(f){
    if (!f) return;
    out.push({o: {kind: f.youtube ? "youtube" : f.movie ? "movie" : "episode",
                  ep: f.ep, series: f.series, title: f.title, name: f.source},
              stage: f.stage || "", pct: (f.pct === undefined ? null : f.pct),
              notches: f.notches || [], raw: f});
  });
  out.forEach(function(c){
    var i = ALL.indexOf(c.stage);
    c.rank = i < 0 ? -1 : i + (c.pct === null ? 0 : Math.max(0, Math.min(100, c.pct)) / 100);
  });
  out.sort(function(a, b){ return b.rank - a.rank; });   /* nearest the finish first */
  return out;
}

function iconFor(kind){
  return kind === "youtube" ? "#i-play" : kind === "movie" ? "#i-film" : "#i-tv";
}
function gb(n){ return (n === null || n === undefined) ? "—" : Math.round(n) + " GB"; }

function render(d){
  var o = d.orchestrator || {}, p = o.progress || {}, cur = o.current || null;
  var armed = !!(d.automation_enabled), running = !!o.running;

  txt($("mode"), d.mode ? d.mode.toUpperCase() : "");

  /* ---- status + arm ------------------------------------------------- */
  var hold = (o.hold || {}).code, sp = $("status");
  var label = !armed ? "Idle" : hold ? "Holding" : running ? "Running" : "Armed";
  sp.className = "pill " + (!armed ? "dim" : running && !hold ? "bright" : "");
  sp.lastElementChild.textContent = label;
  sp.firstElementChild.className = "dot" + (running && !hold ? " live" : "");

  var arm = $("arm");
  arm.disabled = false;
  arm.className = "btn" + (armed ? " lit" : "");
  txt(arm, armed ? "Deactivate" : "Activate");

  /* ---- now: whichever tracked item is CLOSEST TO DONE ------------------ */
  var items = pipelineItems(o), lead = items[0] || null;
  var stage = lead ? lead.stage : "";
  var pct = lead ? lead.pct : null;
  txt($("nowTtl"), lead ? itemName(lead.o) : (armed ? "Waiting for work" : "Not activated"));
  var sub = (o.message || "").trim();
  if (hold) sub = ((o.hold || {}).msg || hold);
  /* the leader may be a finisher item, whose stage the run-thread message doesn't describe */
  if (lead && lead.o !== cur) sub = itemName(lead.o) + ": " + (stage || "finishing");
  txt($("nowSub"), sub || (lead ? (stage || "—") : "—"));
  txt($("nowPct"), "");   /* the percentage lives in the readout row, beside its timings */
  $("nowSec").classList.toggle("off", !lead);

  drawBar(lead);
  drawReadout(lead, d.settings);

  var st = $("stages"), at = ALL.indexOf(stage);
  var haveLead = !!lead;
  if (st.children.length !== ALL.length){
    st.innerHTML = "";
    ALL.forEach(function(s){
      var e = document.createElement("span"); e.className = "stage"; e.textContent = s;
      st.appendChild(e);
    });
  }
  for (var i = 0; i < ALL.length; i++){
    var cls = "stage";
    if (haveLead && at >= 0){ if (i === at) cls += " on"; else if (i < at) cls += " done"; }
    st.children[i].className = cls;
  }

  /* ---- everything else in flight, behind the leader -------------------- */
  var rest = items.slice(1);
  $("laneSec").style.display = rest.length ? "" : "none";
  if (rest.length){
    $("lanes").innerHTML = rest.map(function(c){
      var pc = (c.pct === null) ? "" : Math.round(c.pct) + "%";
      return '<div class="row"><svg class="ic"><use href="' + iconFor(c.o.kind) +
             '"/></svg><span class="t">' + esc(itemName(c.o)) + '</span>' +
             '<span class="pill dim">' + esc(c.stage || "") + '</span>' +
             '<span class="mono" style="color:var(--steel)">' + pc + '</span></div>';
    }).join("");
  }

  /* ---- queue --------------------------------------------------------- */
  var q = d.up_next || [];
  txt($("qCount"), q.length ? "(" + q.length + ")" : "");
  /* Only redraw when the queue actually CHANGED: this polls every 2 s, and rebuilding the
     list under a finger is how a tap lands on the wrong row. */
  lastQ = q;
  var sig = JSON.stringify(q.map(function(u){ return [u.kind, u.name, u.ep, u.priority]; }));
  if (sig !== qSig){ qSig = sig; drawQueue(q); }

  /* ---- the remote-deactivate screen hold ------------------------------- */
  var holdLeft = o.awake_hold_secs || 0;
  $("holdSec").style.display = holdLeft > 0 ? "" : "none";
  if (holdLeft > 0){
    var hm = holdLeft >= 3600
      ? Math.floor(holdLeft / 3600) + "h " + Math.round((holdLeft % 3600) / 60) + "m"
      : Math.max(1, Math.round(holdLeft / 60)) + " min";
    $("hold").innerHTML = '<svg class="ic" style="color:var(--steel-bright)">' +
      '<use href="#i-clock"/></svg><span class="grow">Screen held for <b>' + hm +
      ' more</b> so you can still re-activate from here. After that the Mac may sleep ' +
      'and won\'t be reachable.</span>' +
      '<button class="mini" id="holdMore">+1 hour</button>';
  }

  /* ---- WHY nothing is moving ------------------------------------------
     Remote, a held pipeline looks exactly like a working one: the page is up, the item is
     still there, the percentage just doesn't change. Say the reason outright. */
  var holdMsg = hold ? ((o.hold || {}).msg || hold) : "";
  var idle = armed && !running && !holdMsg ? "Armed, but nothing is running." : "";
  var why = holdMsg || idle;
  $("stallSec").style.display = why ? "" : "none";
  if (why){
    $("stall").innerHTML = '<svg class="ic"><use href="#i-warn"/></svg>' +
      '<span class="grow">' + esc(why) + '</span>';
  }

  /* ---- screen control --------------------------------------------------
     The remote-specific one: if you screen-share into this Mac while Visionary is driving
     Resolve, you fight it for the mouse. Park it first, from here. */
  var st = d.settings || {};
  var qUntil = (st.quiet_until || 0) * 1000, quiet = !!st.quiet_mode && qUntil > Date.now();
  txt($("scState"), quiet
    ? "Paused — Visionary won't touch the screen until " +
      new Date(qUntil).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})
    : "Visionary uses the screen for the Dolby Vision pass. Pause it before you connect.");
  var scb = quiet
    ? '<button class="mini" data-sc="0">Give it back now</button>'
    : [30, 60, 120, 240].map(function(m){
        return '<button class="mini" data-sc="' + (m * 60) + '">Pause ' +
               (m < 60 ? m + " min" : (m / 60) + (m === 60 ? " hour" : " hours")) + '</button>';
      }).join("");
  if ($("scBtns").innerHTML !== scb) $("scBtns").innerHTML = scb;

  /* ---- machine -------------------------------------------------------- */
  var pw = d.power || {}, sc = d.scratch || {}, wn = d.window || {};
  var cells = [
    ["Power", pw.external_connected ? (pw.adapter_watts ? pw.adapter_watts + " W" : "AC") : "Battery",
     !pw.adequate, "#i-bolt"],
    ["Scratch", gb(sc.free_gb) + " free", sc.connected === false, "#i-disk"],
    ["Window", (wn.start || "?") + "–" + (wn.end || "?") + (wn.in_window ? "" : " (closed)"),
     false, "#i-clock"],
    ["Plex", o.plex_playing ? "streaming" : "idle", false, "#i-tv"]
  ];
  $("health").innerHTML = cells.map(function(c){
    return '<div class="panel stat"><div class="l"><svg class="ic" style="vertical-align:-2px">' +
           '<use href="' + c[3] + '"/></svg> ' + c[0] + '</div>' +
           '<div class="n' + (c[2] ? " warn" : "") + '">' + esc(String(c[1])) + '</div></div>';
  }).join("");

  /* ---- issues ---------------------------------------------------------- */
  var log = (d.log || []).filter(function(l){ return /\bFAIL\b/.test(l); }).slice(-6);
  $("issueSec").style.display = log.length ? "" : "none";
  if (log.length){
    $("issues").innerHTML = log.map(function(l){
      return '<div class="issue">' + esc(l).replace("FAIL", "<b>FAIL</b>") + "</div>";
    }).join("");
  }

  /* generated_at is an ISO string from datetime.now() (local, no offset) — NOT epoch
     seconds. Multiplying it gave NaN and the footer read "Invalid Date". */
  lastState = d;
  if (histOpen) drawHistory();
  if (!$("hits").innerHTML) drawPicker();

  var when = d.generated_at ? new Date(d.generated_at) : new Date();
  if (isNaN(when.getTime())) when = new Date();
  txt($("foot"), "updated " + when.toLocaleTimeString());
}

var qSig = "", openGroups = {}, lastQ = [];

/* Only TV EPISODES are numbered (as in the app): movies and videos ride along between
   them, so numbering everything read as though a video were "item 4 of the show". */
function episodeOrdinals(q){
  var m = {}, n = 0;
  q.forEach(function(u, i){ if (u.kind === "episode"){ n += 1; m[i] = n; } });
  return m;
}

/* Runs of consecutive videos collapse into one expandable slot. Order is never changed —
   only how it is drawn. */
function grouped(q){
  var out = [], i = 0;
  while (i < q.length){
    if (q[i].kind === "youtube"){
      var j = i;
      while (j < q.length && q[j].kind === "youtube") j++;
      out.push({start: i, items: q.slice(i, j)});
      i = j;
    } else { out.push({start: i, items: [q[i]]}); i++; }
  }
  return out;
}

function act(sym, kind, o, opts){
  var dis = opts && opts.disabled ? " disabled" : "";
  var cls = "act" + (opts && opts.danger ? " danger" : "");
  return '<button class="' + cls + '"' + dis + ' title="' + esc((opts || {}).help || "") + '"' +
         ' data-act="' + kind + '" data-name="' + esc(o.name || "") + '"' +
         ' data-ch="' + esc(o.channel || "") + '">' +
         '<svg><use href="' + sym + '"/></svg></button>';
}

/* Movies: reorder through the WHOLE queue, or drop them (non-destructive — files stay).
   Videos: jump the queue, or skip & DELETE (confirmed). Episodes are auto-generated and
   carry no controls — exactly the split the app makes. */
function controlsFor(u, idx, total){
  if (u.kind === "movie"){
    return '<span class="acts">' +
      act("#i-up", "up", u, {disabled: idx === 0, help: "Move earlier"}) +
      act("#i-down", "down", u, {disabled: idx === total - 1, help: "Move later"}) +
      act("#i-x", "remove", u, {help: "Remove from the queue (the file stays)"}) + '</span>';
  }
  if (u.kind === "youtube"){
    var lead = u.priority
      ? '<span class="badge" title="Queued to jump — starts when the current segment finishes">running next</span>'
      : act("#i-now", "now", u, {help: "Run this video now — the current segment finishes first"});
    return '<span class="acts">' + lead +
      act("#i-x", "del", u, {danger: true,
          help: "Skip & delete — removes the download and youtarr never re-fetches it"}) + '</span>';
  }
  return "";
}

function rowHtml(u, idx, total, ord, kid){
  return '<div class="row' + (kid ? " kid" : "") + '">' +
    '<span class="k mono">' + (ord ? ord : "") + '</span>' +
    '<svg class="ic"><use href="' + iconFor(u.kind) + '"/></svg>' +
    '<span class="t">' + esc(itemName(u)) + '</span>' +
    (u.channel ? '<span class="c">' + esc(u.channel) + '</span>' : "") +
    controlsFor(u, idx, total) + '</div>';
}

function drawQueue(q){
  if (!q.length){ $("queue").innerHTML = '<div class="muted">Nothing queued</div>'; return; }
  var ord = episodeOrdinals(q);
  $("queue").innerHTML = grouped(q).map(function(g){
    if (g.items.length === 1){
      var i = g.start;
      return rowHtml(g.items[0], i, q.length, ord[i], false);
    }
    var gid = "g" + g.start + "-" + (g.items[0].name || "");
    var open = !!openGroups[gid];
    var head = '<div class="row grp' + (open ? " open" : "") + '" data-act="toggle" data-g="' +
      esc(gid) + '"><span class="k"></span>' +
      '<svg class="ic"><use href="#i-play"/></svg>' +
      '<span class="t">' + g.items.length + ' videos</span>' +
      '<svg class="ic chev"><use href="#i-chev"/></svg></div>';
    var kids = open ? g.items.map(function(u, k){
      return rowHtml(u, g.start + k, q.length, null, true);
    }).join("") : "";
    return head + kids;
  }).join("");
}

/* Delegated, so a redraw never orphans a handler. */
$("queue").addEventListener("click", async function(ev){
  var b = ev.target.closest("[data-act]");
  if (!b) return;
  var a = b.dataset.act, name = b.dataset.name || "", ch = b.dataset.ch || "";
  if (a === "toggle"){
    openGroups[b.dataset.g] = !openGroups[b.dataset.g];
    drawQueue(lastQ);            /* instant: display-only state, no round trip */
    return;
  }
  if (b.disabled) return;
  if (a === "del" && !confirm("Skip & delete this video?\n\nIt deletes the download and tells "
      + "youtarr to forget it — it won't be re-downloaded or upscaled.")) return;
  b.disabled = true;
  try {
    if (a === "up" || a === "down" || a === "remove"){
      await fetch("/api/queue-action", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: a, kind: "movie", name: name})});
    } else if (a === "now"){
      await fetch("/api/youtube-queue", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: "prioritize", name: name})});
    } else if (a === "del"){
      await fetch("/api/youtube-queue", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: "delete", channel: ch, name: name})});
    }
  } catch (e) { /* the poll resyncs */ }
  qSig = "";
  poll(true);
});

/* ---- pick things to process, from away ------------------------------------
   The library is ~400 movies and every show on the NAS, so this is search-first and caps
   what it draws — a phone should never be handed 400 rows. Adds use the SAME endpoints the
   Mac app uses, so nothing here is a second code path. */
var pickTab = "tv", subs = null, movieLib = null, lastState = {};

function tabHits(q){
  var d = lastState, out = [];
  q = (q || "").toLowerCase();
  var match = function(s){ return !q || String(s || "").toLowerCase().indexOf(q) >= 0; };
  if (pickTab === "tv"){
    var titles = (d.series || {}).titles || {}, active = (d.series || {}).active || [];
    Object.keys(titles).forEach(function(folder){
      if (active.indexOf(folder) >= 0 || !(match(titles[folder]) || match(folder))) return;
      out.push({label: titles[folder] || folder, add: {ep: "/api/select",
                body: {series: folder, action: "add"}}});
    });
  } else if (pickTab === "movie"){
    /* library is NULL until it has been built (peek_library), and `selected` is
       {items,next,count} — not a list. Both cost a real bug if assumed. */
    var lib = ((d.movies || {}).library) || (movieLib || []);
    var sel = ((d.movies || {}).selected || {}).items || [];
    var have = {}; sel.forEach(function(m){ have[m.name] = 1; });
    lib.forEach(function(m){
      if (have[m.name] || !match(m.title || m.name)) return;
      out.push({label: m.title || m.name, tag: (m.tags || []).join(" · "),
                blocked: m.has_dv ? "already Dolby Vision — pair a companion instead" : "",
                add: {ep: "/api/movie-queue",
                      body: {action: "add", name: m.name, dir: m.dir, title: m.title}}});
    });
  } else {
    var chans = (subs || {}).channels || [], qd = ((d.youtube || {}).items || []);
    var inq = {}; qd.forEach(function(c){ inq[c.channelId] = 1; });
    chans.forEach(function(c){
      if (inq[c.channelId] || !match(c.title)) return;
      out.push({label: c.title, add: {ep: "/api/youtube-queue",
                body: {action: "add", channelId: c.channelId, title: c.title}}});
    });
  }
  out.sort(function(a, b){ return a.label.localeCompare(b.label); });
  return out;
}

function drawPicker(){
  var q = $("findIn").value, hits = tabHits(q), shown = hits.slice(0, 30);
  $("hits").innerHTML = shown.length ? shown.map(function(h, i){
    return '<div class="hit' + (h.blocked ? " no" : "") + '" data-hit="' + i + '">' +
      '<svg class="ic"><use href="#i-' + (h.blocked ? "warn" : "plus") + '"/></svg>' +
      '<span class="t">' + esc(h.label) + '</span>' +
      (h.blocked ? '<span class="tag">' + esc(h.blocked) + '</span>'
                 : (h.tag ? '<span class="tag">' + esc(h.tag) + '</span>' : "")) + '</div>';
  }).join("") + (hits.length > shown.length
      ? '<div class="muted">' + (hits.length - shown.length) + ' more — keep typing</div>' : "")
    : '<div class="muted">' + ((pickTab === "youtube" && !subs) ? "Loading your subscriptions…"
        : (pickTab === "movie" && !movieLib && !((lastState.movies || {}).library))
          ? "Loading the movie library…" : "Nothing matches") + '</div>';
  $("hits")._hits = shown;

  var rows = [], d = lastState;
  if (pickTab === "tv"){
    rows = ((d.series || {}).active || []).map(function(f){
      return {label: ((d.series || {}).titles || {})[f] || f,
              rm: {ep: "/api/select", body: {series: f, action: "remove"}}};
    });
  } else if (pickTab === "movie"){
    rows = (((d.movies || {}).selected || {}).items || []).map(function(m){
      return {label: m.title || m.name,
              rm: {ep: "/api/movie-queue", body: {action: "remove", name: m.name}}};
    });
  } else {
    rows = ((d.youtube || {}).items || []).map(function(c){
      return {label: c.title + (c.via_link ? "  (added by link)" : ""),
              rm: {ep: "/api/youtube-queue", body: {action: "remove", channelId: c.channelId}}};
    });
  }
  txt($("queuedN"), rows.length ? "(" + rows.length + ")" : "");
  $("queued").innerHTML = rows.length ? rows.map(function(r, i){
    return '<div class="row"><span class="t">' + esc(r.label) + '</span>' +
      '<span class="acts"><button class="act danger" data-rm="' + i + '" title="Remove">' +
      '<svg><use href="#i-x"/></svg></button></span></div>';
  }).join("") : '<div class="muted">Nothing yet</div>';
  $("queued")._rows = rows;
}

async function pickerPost(spec){
  try {
    var r = await fetch(spec.ep, {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(spec.body)});
    var j = await r.json().catch(function(){ return {}; });
    if (j && j.error) alert(j.error);
  } catch (e) { /* the poll resyncs */ }
  qSig = "";
  await poll(true);
  drawPicker();
}

document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", async function(){
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x === t); });
    pickTab = t.dataset.tab;
    $("ytLink").style.display = pickTab === "youtube" ? "" : "none";
    $("findIn").value = "";
    drawPicker();
    if (pickTab === "youtube" && !subs){
      try { subs = await (await fetch("/api/channels")).json(); } catch (e) { subs = {}; }
      drawPicker();
    }
    if (pickTab === "movie" && !movieLib){
      try {
        var mv = await (await fetch("/api/movies")).json();
        movieLib = mv.library || [];      // api_movies(): {library, selected, reachable, titles}
      } catch (e) { movieLib = []; }
      drawPicker();
    }
  });
});
$("findIn").addEventListener("input", drawPicker);
$("hits").addEventListener("click", function(ev){
  var el = ev.target.closest("[data-hit]"); if (!el) return;
  var h = ($("hits")._hits || [])[parseInt(el.dataset.hit, 10)];
  if (h && !h.blocked) pickerPost(h.add);
});
$("queued").addEventListener("click", function(ev){
  var el = ev.target.closest("[data-rm]"); if (!el) return;
  var r = ($("queued")._rows || [])[parseInt(el.dataset.rm, 10)];
  if (!r) return;
  if (pickTab === "youtube" &&
      !confirm("Remove this channel?\n\nIts downloaded videos and 4K masters are deleted too.")) return;
  pickerPost(r.rm);
});

/* Paste a link — the same resolve -> confirm -> import flow the app uses. */
async function importLink(choice){
  var url = $("linkIn").value.trim(), note = $("linkNote");
  if (!url) return;
  note.style.display = ""; note.innerHTML = "Resolving\u2026";
  var r = await (await fetch("/api/youtube-queue", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action: "resolve_link", url: url})})).json().catch(function(){ return {}; });
  if (r.status !== "ok"){
    note.innerHTML = esc({"bad-url": "That doesn\u2019t look like a YouTube link.",
      "playlist-unreadable": "That playlist is private or unavailable.",
      "channel-unresolved": "Couldn\u2019t find that channel."}[r.status] || "Couldn\u2019t resolve that link.");
    return;
  }
  if (!choice && (r.ambiguous || r.kind === "playlist")){
    var n = r.count || 0;
    note.innerHTML = '<span class="grow">' + esc(r.title || "Playlist") +
      (n ? " — " + n + " videos" : "") + '</span>' +
      (r.ambiguous ? '<button class="mini" data-imp="video">Just this video</button>' : "") +
      '<button class="mini" data-imp="playlist">Import' + (n ? " all " + n : "") + '</button>';
    return;
  }
  note.innerHTML = "Importing\u2026";
  var out = await (await fetch("/api/youtube-queue", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({action: "import_link", url: url, choice: choice})})).json()
    .catch(function(){ return {}; });
  var imp = out["import"] || {};
  note.innerHTML = esc({queued: "Queued " + (imp.count || 0) + " video(s).",
    "channel-queued": "Added " + (imp.title || "that channel") + ".",
    "already-queued": "Already queued.",
    "youtarr-unreachable": "youtarr didn\u2019t respond \u2014 nothing was queued.",
    empty: "Nothing to import."}[imp.status] || "Import failed.");
  if (imp.status === "queued" || imp.status === "channel-queued") $("linkIn").value = "";
  qSig = ""; await poll(true); drawPicker();
}
$("linkGo").addEventListener("click", function(){ importLink(null); });
$("linkIn").addEventListener("keydown", function(e){ if (e.key === "Enter") importLink(null); });
$("linkNote").addEventListener("click", function(ev){
  var b = ev.target.closest("[data-imp]"); if (b) importLink(b.dataset.imp);
});

/* ---- what has finished, and sending one back for its audio ----------------
   Kept behind an icon: it is a look-back, not something you watch. The revision is audio
   ONLY and happens in place — by the time an item finishes its source is usually gone
   (replaced or purged), so re-running it is not an option; the published master is the
   only copy, and video/subs are stream-copied so Dolby Vision is untouched. */
var histOpen = false;

function histWhen(ts){
  if (!ts) return "";
  var d = new Date(ts * 1000), now = new Date();
  var sameDay = d.toDateString() === now.toDateString();
  return sameDay ? d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})
                 : d.toLocaleDateString([], {month: "short", day: "numeric"});
}

async function drawHistory(){
  if (!histOpen) return;
  var rows;
  try { rows = (await (await fetch("/api/history")).json()).items || []; }
  catch (e) { $("hist").innerHTML = '<div class="muted">Couldn\u2019t load</div>'; return; }
  txt($("histN"), rows.length ? "(" + rows.length + ")" : "");
  $("hist").innerHTML = rows.length ? rows.map(function(r, i){
    var sub = [histWhen(r.at), (r.gain ? "+" + r.gain + " dB" : ""),
               (r.revised ? "revised" : "")].filter(Boolean).join(" · ");
    var btn = r.revising
      ? '<span class="badge">fixing\u2026</span>'
      : (r.can_revise
          ? '<button class="act" data-rev="' + i + '" title="Re-measure and re-apply the ' +
            'loudness boost to this file, in place">' +
            '<svg><use href="#i-wave"/></svg></button>'
          : '<span class="tag" title="' + esc(r.why || "") + '">' + esc(r.why || "") + '</span>');
    return '<div class="row"><svg class="ic"><use href="' + iconFor(r.kind) + '"/></svg>' +
      '<span class="t">' + esc(r.title || r.nas_path) + '</span>' +
      '<span class="c">' + esc(sub) + '</span>' +
      '<span class="acts">' + btn + '</span></div>';
  }).join("") : '<div class="muted">Nothing finished yet</div>';
  $("hist")._rows = rows;
}

$("histScan").addEventListener("click", async function(){
  // Everything upscaled before the history book existed is invisible to it — this walks the
  // libraries for the pipeline's own master naming and adopts what is missing.
  var b = $("histScan");
  b.disabled = true; b.textContent = "Searching\u2026";
  try { await fetch("/api/history-scan", {method: "POST",
        headers: {"Content-Type": "application/json"}, body: "{}"}); } catch (e) {}
  setTimeout(function(){ b.disabled = false; b.textContent = "Find finished files"; drawHistory(); }, 6000);
});

$("histBtn").addEventListener("click", function(){
  histOpen = !histOpen;
  $("histSec").style.display = histOpen ? "" : "none";
  if (histOpen) drawHistory();
});

$("hist").addEventListener("click", async function(ev){
  var b = ev.target.closest("[data-rev]"); if (!b) return;
  var r = ($("hist")._rows || [])[parseInt(b.dataset.rev, 10)];
  if (!r) return;
  if (!confirm("Fix the audio on \u201C" + (r.title || "this file") + "\u201D?\n\n" +
               "It re-measures the published file and re-applies the loudness boost in " +
               "place. Video and subtitles are copied untouched, so it takes minutes.")) return;
  b.disabled = true;
  try {
    var out = await (await fetch("/api/revise-audio", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: r.nas_path})})).json();
    if (out.error) alert(out.error);
  } catch (e) { /* the refresh below resyncs */ }
  drawHistory();
});

function pad(n){ return (n < 10 ? "0" : "") + n; }
/* " · ~7 min left" — the app's exact thresholds, so the two never disagree. */
function etaSuffix(secs){
  if (!secs || secs <= 0) return "";
  var t = Math.round(secs);
  if (t < 90) return " · ~" + t + "s left";
  if (t < 5400) return " · ~" + Math.round(secs / 60) + " min left";
  return " · ~" + Math.floor(t / 3600) + "h " + Math.floor((t % 3600) / 60) + "m left";
}
/* stopwatch counting UP: "9:12" or "1:09:12" */
function elapsedClock(secs){
  if (!secs || secs < 1) return "";
  var t = Math.round(secs), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60);
  return h > 0 ? h + ":" + pad(m) + ":" + pad(t % 60) : m + ":" + pad(t % 60);
}

/* The app's SteelBar: a bright fill to the last COMPLETED segment boundary, a shadow fill
   at live progress, and only the NEXT boundary marked. During a peak repair the segment
   being re-encoded is cut back out and refills with its real frame progress. */
function drawBar(lead){
  var bar = $("nowBar");
  var live = document.querySelector("#nowBar .live"), done = document.querySelector("#nowBar .done");
  var notch = bar.querySelector("u"), cut = bar.querySelector(".cut"), refill = bar.querySelector(".refill");
  var pct = lead && lead.pct !== null ? Math.max(0, Math.min(1, lead.pct / 100)) : 0;
  var ns = (lead && lead.notches) || [], raw = (lead && lead.raw) || {};
  var segDone = raw.seg_done || 0;
  var bright = !ns.length ? pct
             : (segDone >= ns.length ? 1 : (segDone > 0 ? ns[segDone - 1] : 0));
  live.style.width = (pct * 100).toFixed(2) + "%";
  done.style.width = (bright * 100).toFixed(2) + "%";
  var next = ns.filter(function(n){ return n > bright + 0.001 && n < 0.999; })[0];
  notch.style.display = next ? "block" : "none";
  if (next) notch.style.left = (next * 100).toFixed(2) + "%";
  var rs = raw.repair_seg;
  if (rs && ns.length){
    var lo = rs > 1 ? ns[rs - 2] : 0, hi = ns[rs - 1] || 1;
    var frac = raw.repair_total ? (raw.repair_done || 0) / raw.repair_total : 0;
    [cut, refill].forEach(function(e){ e.style.display = "block"; e.style.left = (lo*100).toFixed(2) + "%"; });
    cut.style.width = ((hi - lo) * 100).toFixed(2) + "%";
    refill.style.width = ((hi - lo) * Math.max(0, Math.min(1, frac)) * 100).toFixed(2) + "%";
  } else {
    cut.style.display = refill.style.display = "none";
  }
}

/* Everything the app's card says: percentage, elapsed stopwatch, stage ETA, and the
   CURRENT segment's countdown — the stage ETA alone reads as "hours away", so the segment
   gives near-term motion. The segment ETA is gated on that segment's projected TOTAL
   against seg_eta_after_minutes, judged on the segment itself, so the number stays put for
   the whole segment instead of vanishing as it counts to zero. */
function drawReadout(lead, settings){
  var el = $("readout");
  if (!lead){ el.innerHTML = ""; return; }
  var raw = lead.raw || {}, bits = [];
  bits.push('<span class="big mono">' + (lead.pct === null ? "—" : Math.round(lead.pct) + "%") + '</span>');
  var e = elapsedClock(raw.elapsed_secs);
  if (e) bits.push('<span class="m mono">' + e + '</span>');
  var eta = etaSuffix(raw.eta_secs);
  if (eta) bits.push('<span class="m mono">' + esc(eta.replace(" · ", "")) + '</span>');
  if (raw.eta_secs > 0){
    /* Remote, "~5h 52m left" is hard to act on — a clock time is what you actually plan
       around ("it lands before I wake up"). */
    var at = new Date(Date.now() + raw.eta_secs * 1000);
    bits.push('<span class="m mono">done ~' +
      at.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}) + '</span>');
  }
  var d = raw.seg_done, t = raw.seg_total;
  if (t > 0){
    var gate = ((settings || {}).seg_eta_after_minutes || 15) * 60;
    var segEta = ((raw.seg_secs || 0) > gate && raw.seg_eta_secs > 0)
      ? etaSuffix(raw.seg_eta_secs).replace(" left", "") : "";
    bits.push('<span class="seg mono">segment ' + Math.min((d || 0) + 1, t) + '/' + t +
              esc(segEta) + '</span>');
  } else if (raw.frames && raw.total){
    bits.push('<span class="seg mono">' + raw.frames.toLocaleString() + ' / ' +
              raw.total.toLocaleString() + ' frames</span>');
  }
  el.innerHTML = bits.join("");
}

function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

var first = true;
async function poll(force){
  /* A backgrounded phone tab shouldn't poll — but the FIRST load always must (or a tab
     restored from the background sits blank), and so must a refresh the user just asked
     for by tapping a control. */
  if (busy || (document.hidden && !first && !force)) return;
  busy = true; first = false;
  try {
    var r = await fetch("/api/state", {cache: "no-store"});
    if (r.status === 401){ document.body.innerHTML =
      '<p class="muted" style="margin-top:40px">Not authorized. Open this page with your access key once.</p>';
      clearInterval(timer); return; }
    render(await r.json());
    $("foot").classList.remove("off");
  } catch (e) {
    $("foot").classList.add("off");
    txt($("foot"), "reconnecting…");
  } finally { busy = false; }
}

$("arm").addEventListener("click", async function(){
  var on = $("arm").textContent === "Activate";
  $("arm").disabled = true;
  try {
    var r = await fetch("/api/automation", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({enabled: on})
    });
    var j = await r.json().catch(function(){ return {}; });
    if (j && j.error) txt($("nowSub"), j.detail || j.error);
  } catch (e) { /* the poll will resync */ }
  poll();
});

/* Screen Control + "another hour", both delegated so a redraw never orphans them. */
document.body.addEventListener("click", async function(ev){
  var sc = ev.target.closest("[data-sc]");
  if (sc){
    var secs = parseInt(sc.dataset.sc, 10);
    sc.disabled = true;
    await fetch("/api/quiet-mode", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(secs > 0 ? {enabled: true, seconds: secs} : {enabled: false})
    }).catch(function(){});
    poll(true);
    return;
  }
  if (ev.target.closest("#holdMore")){
    ev.target.disabled = true;
    await fetch("/api/awake-hold", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({seconds: 3600})
    }).catch(function(){});
    poll(true);
  }
});

/* THE SCREEN. On demand, never polled: it is a full screenshot and this is used on
   cellular. It is also the only way to see what Resolve is doing with the lid closed. */
(function(){
  var img = $("shot"), msg = $("shotMsg");
  function load(){
    msg.textContent = "loading…";
    img.onload = function(){ msg.textContent = ""; img.style.display = "block"; };
    img.onerror = function(){ msg.textContent = "couldn't capture the screen"; img.style.display = "none"; };
    img.src = "/api/screen.png?t=" + Date.now();
  }
  $("shotBtn").addEventListener("click", function(){
    $("shotBtn").style.display = "none";
    $("shotRef").style.display = $("shotHide").style.display = "";
    load();
  });
  $("shotRef").addEventListener("click", load);
  $("shotHide").addEventListener("click", function(){
    img.style.display = "none"; img.removeAttribute("src"); msg.textContent = "";
    $("shotBtn").style.display = "";
    $("shotRef").style.display = $("shotHide").style.display = "none";
  });
})();

document.addEventListener("visibilitychange", function(){ if (!document.hidden) poll(true); });
poll();
timer = setInterval(poll, 2000);
</script>
</body>
